[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitler"
version = "0.1.0"
description = "Offline subtitle editor that segments speech into reading-speed compliant cues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "faster-whisper>=1.0",
    "regex>=2023.0",
    "uniseg>=0.8",
    "numpy>=1.26",
    "scenedetect[opencv]>=0.7",
    "onnxruntime>=1.16",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.scripts]
subtitler = "subtitler.app:main"
subtitler-batch = "subtitler.batch:main"

[tool.setuptools.packages.find]
include = ["subtitler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
